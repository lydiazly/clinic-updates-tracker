# This workflow will install Python dependencies and run a script
# then notify the user about the result
# [Actions secrets] GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET, GMAIL_REFRESH_TOKEN,
#                   GMAIL_SENDER
# [Actions variables] TARGET_BASE_URL, TARGET_TZ, CITY,
#                     DAYS_BACK, MAX_ITEMS, RETRIES,
#                     RECIPIENT_LIST(comma-separated)

name: Run and Notify

on:
  schedule:
    - cron: '0 19 * * *'  # 19:00 UTC every day (set to 12:00 local time)
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode (10 items, 3 months)'
        required: false
        type: boolean
        default: false
      debug_mode:
        description: 'Debug mode (print variables only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run-task:

    runs-on: ubuntu-latest

    env:
      TEST_MODE: ${{ github.event.inputs.test_mode == 'true' && 'true' || 'false' }}
      DAYS_BACK: ${{ github.event.inputs.test_mode == 'true' && '90' || vars.DAYS_BACK }}
      MAX_ITEMS: ${{ github.event.inputs.test_mode == 'true' && '10' || vars.MAX_ITEMS }}
      OUTPUT_HTML_PATH: ./output/content.html

    steps:
      - name: Debug variables
        if: github.event.inputs.debug_mode == 'true'
        run: |
          echo "*** Debug Mode ***"
          echo "github.event.inputs.test_mode: '${{ github.event.inputs.test_mode }}'"
          echo "                env.TEST_MODE: '${{ env.TEST_MODE }}'"
          echo "               vars.DAYS_BACK: '${{ vars.DAYS_BACK }}'"
          echo "                env.DAYS_BACK: '${{ env.DAYS_BACK }}'"
          echo "               vars.MAX_ITEMS: '${{ vars.MAX_ITEMS }}'"
          echo "                env.MAX_ITEMS: '${{ env.MAX_ITEMS }}'"
          echo "         vars.TARGET_BASE_URL: '${{ vars.TARGET_BASE_URL }}'"
          echo "               vars.TARGET_TZ: '${{ vars.TARGET_TZ }}'"
          echo "                    vars.CITY: '${{ vars.CITY }}'"
          echo "                 vars.RETRIES: '${{ vars.RETRIES }}'"
          echo "         env.OUTPUT_HTML_PATH: '${{ env.OUTPUT_HTML_PATH }}'"
          echo "Debugging complete. Exiting workflow."
          exit 1

      - name: Configure man-db to speed up
        run: |
          echo "set man-db/auto-update false" | sudo debconf-communicate && sudo dpkg-reconfigure man-db

      - name: Update
        run: |
          sudo apt-get update

      - name: Checkout repository
        uses: actions/checkout@v4  # default: fetch-depth=1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add ~/.local/bin to PATH
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          python3 --version
          python3 -m pip install --no-cache-dir --upgrade --user pip
          python3 -m pip install --no-cache-dir --user -r requirements.txt

      - name: Install chromium headless shell
        run: |
          python3 -m playwright install --with-deps --only-shell chromium

      - name: Install clinictracker
        run: |
          python3 -m pip install --no-cache-dir --user .

      - name: Run script and save to OUTPUT_HTML_PATH
        shell: bash
        run: |
          for i in $(seq 1 ${{ vars.RETRIES }}); do
            clinictracker --headless-shell \
              --url "${{ vars.TARGET_BASE_URL }}" \
              --tz "${{ vars.TARGET_TZ }}" \
              --days ${{ env.DAYS_BACK }} \
              --nmax ${{ env.MAX_ITEMS }} \
              --output "${{ env.OUTPUT_HTML_PATH }}" \
              --debug \
              "${{ vars.CITY }}"
            if [ $? -eq 0 ]; then break; fi
            echo "> Waiting to retry ($i/${{ vars.RETRIES }})..."
            sleep 5
          done
          echo "✓ Script completed successfully."

      # Read the HTML file and set it as output, escaping newlines
      - name: Check HTML content
        id: check_html
        shell: bash
        run: |
          if [ -s "${{ env.OUTPUT_HTML_PATH }}" ]; then
            content=$(cat "${{ env.OUTPUT_HTML_PATH }}" | sed -E 's/^.*<body>(.+)<\/body>.*$/\1/')
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "✓ HTML content loaded (${#content} characters)"
          else
          echo "has_updates=false" >> $GITHUB_OUTPUT
          echo "No updates. Nothing to do."
          fi

      - name: Parse recipient email list
        if: env.TEST_MODE == 'true' || steps.check_html.outputs.has_updates == 'true'
        id: parse_emails
        env:
          RECIPIENT_LIST: ${{ vars.RECIPIENT_LIST }}
        shell: bash
        run: |
          emails=$(echo "${RECIPIENT_LIST}" | xargs | sed -E 's/ *[\t ,]+ */, /g')
          if [ -z "${emails}" ]; then
            echo "WARNING: No emails found in vars.RECIPIENT_LIST" >&2
            echo "has_recipients=false" >> $GITHUB_OUTPUT
          else
            echo "> Parsed emails: ${emails}"
            echo "has_recipients=true" >> $GITHUB_OUTPUT
            echo "emails=${emails}" >> $GITHUB_OUTPUT
          fi

      - name: Send email to all listed users via Gmail API
        if: (env.TEST_MODE == 'true' || steps.check_html.outputs.has_updates == 'true') && steps.parse_emails.outputs.has_recipients == 'true'
        run: |
          echo "> Requesting Gmail access token..."
          token_response=$(curl -s \
            -d "client_id=${{ secrets.GMAIL_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.GMAIL_CLIENT_SECRET }}" \
            -d "refresh_token=${{ secrets.GMAIL_REFRESH_TOKEN }}" \
            -d "grant_type=refresh_token" \
            https://oauth2.googleapis.com/token)
          access_token=$(echo ${token_response} | jq -r .access_token)

          if [ "${access_token}" = "null" ] || [ -z "${access_token}" ]; then
            echo -e "✗ Failed to get Gmail access token:\n${token_response}" >&2
            exit 1
          fi
          echo "✓ Successfully obtained Gmail access token."

          sender="Lydia Zhang <${{ secrets.GMAIL_SENDER }}>"
          recipients="${{ steps.parse_emails.outputs.emails }}"
          repo="${{ github.repository }}"
          is_test="${{ env.TEST_MODE }}"

          subject_prefix=""
          [ "${is_test}" = "true" ] && subject_prefix=" [TEST]"
          subject_encoded=$(echo -n "${subject_prefix} Clinic Update Alerts" | base64)
          subject="=?UTF-8?B?${subject_encoded}?="

          body="<body>"
          body+=$(cat "${{ env.OUTPUT_HTML_PATH }}" | sed -E 's/^.*<body>(.+)<\/body>.*$/\1/' | tr '\n' ' ')
          body+="<br><hr><p style=\"color:gray\">"
          body+="You are receiving this email because "
          body+="a GitHub Actions workflow <strong>run-task</strong> "
          body+="in repository <strong>${repo}</strong> is triggered."
          body+="</p>"
          body+="<p style=\"color:gray\">Sent by GitHub Actions. Please do not reply directly.</p>"
          body+="</body>"

          raw_message="From: ${sender}\nTo: ${recipients}\nSubject: ${subject}"
          raw_message+="\nContent-Type: text/html; charset=UTF-8"
          raw_message=$(printf "${raw_message}\n\n${body}" | base64 | tr -d '\n')

          echo "> Sending to: ${recipients}"
          response=$(curl -s -X POST \
            -H "Authorization: Bearer ${access_token}" \
            -H "Content-Type: application/json" \
            -d "{\"raw\": \"${raw_message}\"}" \
            https://gmail.googleapis.com/gmail/v1/users/me/messages/send)

          if echo "${response}" | jq -e '.id' >/dev/null 2>&1; then
            echo "✓ Email sent successfully."
          else
            echo -e "✗ Failed to send email:\n${response}" >&2
          fi
