[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "clinictracker"
version = "0.1.3"
authors = [{ name = "Lydia Zhang" }]
description = "Fetches clinic updates across specified regions from a target website."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "beautifulsoup4>=4.13.5",
    "psycopg2-binary>=2.9.10",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.2.0",
    "pytest-playwright>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "types-psycopg2",
    "types-python-dateutil",
    "types-requests",
    "pre-commit",
]

[project.scripts]
clinictracker = "clinictracker.cli:main"
clinictracker-user = "clinictracker.user.cli:main"

[project.urls]
"Homepage" = "https://github.com/lydiazly/clinic-updates-tracker"
"Bug Tracker" = "https://github.com/lydiazly/clinic-updates-tracker/issues"

[tool.pytest.ini_options]
addopts = "--browser-channel chromium -s"
testpaths = ["tests"]

[tool.ruff]
include = ["*.py"]
line-length = 88
exclude = [
    ".eggs",
    ".git",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pytest_cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    ".vscode",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "ANN", "C901", "Q"]
# select = ["E", "F", "I", "B", "W", "ANN", "Q"]
ignore = ["I001", "Q000", "Q001"]
exclude = ["generated"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["E402", "F401"]
"tests/*.py" = ["ANN"]

[tool.ruff.format]
quote-style = "preserve"
